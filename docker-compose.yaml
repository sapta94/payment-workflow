x-payment-api-common: &payment-api-common
  build:
    context: .
    dockerfile: Dockerfile

  env_file:
    - .env

  environment:
    # localhost inside a container means that container. MySQL runs on the host.
    DATABASE_URL: ${DATABASE_URL_DOCKER}
    VAULT_DATABASE_URL: ${VAULT_DATABASE_URL_DOCKER}

  extra_hosts:
    - "host.docker.internal:host-gateway"

  expose:
    - "8000"

  depends_on:
    kafka:
      condition: service_started
    processor_a:
      condition: service_healthy
    processor_b:
      condition: service_healthy
    processor_c:
      condition: service_healthy

  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 15s

  networks:
    - smartpay-network

  restart: unless-stopped

services:

  # ============================================================
  # PAYMENT API INSTANCES
  # Nginx is the only public entry point and distributes requests across these.
  # ============================================================
  payment-api-1:
    <<: *payment-api-common
    container_name: smartpay-api-1

  payment-api-2:
    <<: *payment-api-common
    container_name: smartpay-api-2

  payment-api-3:
    <<: *payment-api-common
    container_name: smartpay-api-3

  # ============================================================
  # PUBLIC NGINX REVERSE PROXY / ROUND-ROBIN LOAD BALANCER
  # ============================================================
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx

    container_name: smartpay-nginx

    ports:
      # API, Swagger, and the dashboard remain available on this public port.
      - "8000:80"

    depends_on:
      payment-api-1:
        condition: service_healthy
      payment-api-2:
        condition: service_healthy
      payment-api-3:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - smartpay-network

    restart: unless-stopped


  # ============================================================
  # PROCESSOR A
  # ============================================================

  processor_a:
    build:
      context: .
      dockerfile: Dockerfile.processor

    container_name: smartpay-processor-a

    command:
      [
        "uvicorn",
        "processor_servers.processor_a.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001"
      ]

    ports:
      - "8001:8001"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - smartpay-network

    restart: unless-stopped


  # ============================================================
  # PROCESSOR B
  # ============================================================

  processor_b:
    build:
      context: .
      dockerfile: Dockerfile.processor

    container_name: smartpay-processor-b

    command:
      [
        "uvicorn",
        "processor_servers.processor_b.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8002"
      ]

    ports:
      - "8002:8002"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - smartpay-network

    restart: unless-stopped


  # ============================================================
  # PROCESSOR C
  # ============================================================

  processor_c:
    build:
      context: .
      dockerfile: Dockerfile.processor

    container_name: smartpay-processor-c

    command:
      [
        "uvicorn",
        "processor_servers.processor_c.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8003"
      ]

    ports:
      - "8003:8003"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - smartpay-network

    restart: unless-stopped

  # ============================================================
  # Merchant Server
  # ============================================================
  merchant-server:
    image: python:3.11-slim

    container_name: demo-merchant

    working_dir: /merchant

    volumes:
      - ./merchant_server:/merchant

    command:
      [
        "sh",
        "-c",
        "pip install --no-cache-dir fastapi 'uvicorn[standard]' pydantic && uvicorn main:app --host 0.0.0.0 --port 9000"
      ]

    ports:
      - "9000:9000"

    networks:
      - smartpay-network

    restart: unless-stopped

  # ============================================================
  # KAFKA
  # ============================================================

  kafka:
    image: apache/kafka:4.3.1

    container_name: smartpay-kafka

    ports:
      - "9092:9092"

    environment:

      # -------------------------
      # KRaft
      # -------------------------

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093


      # -------------------------
      # Listeners
      # -------------------------

      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT


      # -------------------------
      # Single-node configuration
      # -------------------------

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0


      # -------------------------
      # Development settings
      # -------------------------

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_LOG_RETENTION_HOURS: 168

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - smartpay-network

    restart: unless-stopped

  webhook-consumer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: smartpay-webhook-consumer

    command:
      [
        "python",
        "-m",
        "app.messaging.consumer_main"
      ]

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      VAULT_DATABASE_URL: ${VAULT_DATABASE_URL_DOCKER}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - kafka
      - merchant-server

    networks:
      - smartpay-network

    restart: unless-stopped
  
  # ============================================================
  # OUTBOX PUBLISHER
  # ============================================================

  outbox-publisher:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: smartpay-outbox-publisher

    command:
      [
        "python",
        "-m",
        "app.messaging.publisher_main"
      ]

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      VAULT_DATABASE_URL: ${VAULT_DATABASE_URL_DOCKER}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - kafka

    networks:
      - smartpay-network

    restart: unless-stopped

  # ============================================================
  # OPT-IN LOAD TEST RUNNER
  # ============================================================
  # Run explicitly with:
  # docker compose --profile load-test run --rm load-tester --help
  load-tester:
    build:
      context: .
      dockerfile: Dockerfile

    profiles: ["load-test"]

    entrypoint: ["python", "scripts/load_test.py"]

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      LOAD_TEST_DATABASE_URL: ${DATABASE_URL_DOCKER}
      LOAD_TEST_TARGET_URL: http://nginx/api/payment/make-payment

    depends_on:
      nginx:
        condition: service_healthy

    volumes:
      - ./reports:/app/reports

    networks:
      - smartpay-network
# ================================================================
# NETWORK
# ================================================================

networks:
  smartpay-network:
    driver: bridge


# ================================================================
# VOLUMES
# ================================================================

volumes:
  kafka_data:
