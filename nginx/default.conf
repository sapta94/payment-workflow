upstream payment_api_upstream {
    # Nginx uses round-robin balancing when no alternative method is configured.
    server payment-api-1:8000;
    server payment-api-2:8000;
    server payment-api-3:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    location / {
        proxy_pass http://payment_api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Never replay a payment POST to another instance after a backend error.
        # The app's idempotency handling is still the final duplicate-payment guard.
        proxy_next_upstream off;
    }
}
